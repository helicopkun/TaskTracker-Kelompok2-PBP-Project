<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styling/style.css">
    <link rel="stylesheet" href="styling/login.css">
</head>
<body>
    <div class="main">

        <div class="left-section">
            <img class="logo" src="assets/image.png" alt="Logo">

            <h1 class="heading">
                Stay focused on what matters<br>
                <span class="gradient-text">every day.</span>
            </h1>

            <img class="illustration" src="https://static.cdninstagram.com/rsrc.php/yJ/r/53X3pk-t2Gn.webp" alt="Ilustrasi Instagram">
        </div>

        <div class="right-section">
            <h2 class="form-title">Log in to Task Tracker</h2>

            <form class="login-form" id="formLogin">
                <div class="input-box">
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>

                <div class="input-box">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit" id="btnLogin" class="login-button">Log in</button>
                <p id="pesan" role="status"></p>
                <!-- <a href="#" class="forgot-link">Forgotten password?</a> -->

                <a href="/register">
                    <button type="button" class="create-button">Create new account</button>
                </a>
            </form>
        </div>

    </div>

    <!-- <div class="footer">
        <div class="footer-links">
            
        </div>
        <p class="footer-copy">
        </p>
    </div> -->
    
    <script type="module" src="script/login_script.js"></script>
</body>
</html>
